  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-family: 'Nunito';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"524ede7b-bfeb-4a56-8c24-c97e006e3af9\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n*,*::before,*::after{box-sizing:border-box}\nbody{margin:0;background:#F7FBFD}\na{color:#00BCFB}\na:hover{color:#0398C9}\n@keyframes fp-rise{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}\n@keyframes fp-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}\ntextarea,input{font-family:'Nunito',sans-serif}\ntextarea:focus,input:focus{border-color:#00BCFB!important;background:#fff!important}\n@media (max-width:760px){\n  [data-s]{padding-left:18px!important;padding-right:18px!important}\n  [data-s] h1{font-size:clamp(27px,7.4vw,36px)!important}\n  [data-fp=\"bar\"]{flex-direction:column!important;align-items:stretch!important;gap:12px!important}\n  [data-fp=\"bar\"] a{text-align:center}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family:'Nunito',sans-serif;color:#0B2A3F;min-height:100vh\">\n\n  <!-- sticky progress -->\n  <div style=\"position:sticky;top:0;z-index:40;background:rgba(247,251,253,.94);backdrop-filter:blur(10px);border-bottom:1px solid #E5EFF5\">\n    <div data-fp=\"bar\" style=\"max-width:820px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:16px\">\n      <div style=\"display:flex;align-items:center;gap:9px;flex-shrink:0\">\n        <img src=\"6ca86e2f-c432-4a33-a7e6-5dc1efb7ce72\" alt=\"\" style=\"width:30px;height:auto\">\n        <span style=\"font-family:'Bigover';font-size:17px\">Arab<span style=\"color:#00BCFB\">Facile<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"height:9px;background:#E2EEF5;border-radius:999px;overflow:hidden\">\n          <div style=\"width:{{ pct }};height:100%;background:#00BCFB;border-radius:999px;transition:width .35s cubic-bezier(.34,1.3,.64,1)\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"color:#4F6E80;font-weight:800;font-size:12px;margin-top:5px\">{{ progressLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <a sc-camel-on-click=\"{{ save }}\" style=\"text-decoration:none;color:#fff;font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;font-size:15px;padding:11px 20px;border-radius:13px;background:#00BCFB;border-bottom:4px solid #0398C9;cursor:pointer;white-space:nowrap;transition:transform .14s cubic-bezier(.34,1.4,.64,1)\" style-hover=\"transform:translateY(-2px)\" style-active=\"transform:translateY(2px);border-bottom-width:2px\">{{ saveLabel }}<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <section data-s=\"\" style=\"max-width:820px;margin:0 auto;padding:40px 28px 30px\">\n    <div style=\"display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:26px\">\n      <img src=\"21927767-2ccd-4a92-9b4e-0556dfc3050d\" alt=\"Osaid\" style=\"width:104px;height:auto;aspect-ratio:574/678;flex-shrink:0;animation:fp-breathe 3.6s ease-in-out infinite\">\n      <div style=\"flex:1;min-width:250px\">\n        <div style=\"display:inline-block;background:#FFB800;color:#0B2A3F;font-weight:800;font-size:12px;padding:5px 13px;border-radius:999px;margin-bottom:12px\">AVANT D'ÉCRIRE LES TEXTES DU SITE<\u002Fdiv>\n        <h1 style=\"font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;letter-spacing:-.4px;font-size:38px;line-height:1.06;margin:0 0 10px\">Parlez-nous de vos familles<\u002Fh1>\n        <p style=\"font-size:17px;line-height:1.55;color:#4F6E80;margin:0\">Répondez en quelques mots, sans rédiger. Vos réponses se sauvegardent au fur et à mesure&nbsp;: vous pouvez fermer la page et revenir plus tard.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#FFF7E6;border:1px solid #FCE8BA;border-radius:14px;padding:15px 18px;font-size:14px;color:#7A6620;font-weight:700;line-height:1.55\">Une réponse honnête et courte vaut mieux qu'un paragraphe soigné&nbsp;: c'est de là que sortiront les phrases du site. Les cinq questions marquées d'une étoile sont les plus importantes.<\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-s=\"\" style=\"max-width:820px;margin:0 auto;padding:0 28px 40px\">\n    <sc-for list=\"{{ sections }}\" as=\"S\" hint-placeholder-count=\"8\">\n      <div style=\"margin-bottom:34px\">\n        <div style=\"display:flex;align-items:center;gap:13px;margin-bottom:5px\">\n          <div style=\"width:34px;height:34px;border-radius:11px;background:{{ S.color }};color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;font-size:16px;flex-shrink:0\">{{ S.n }}<\u002Fdiv>\n          <h2 style=\"font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;letter-spacing:-.3px;font-size:26px;margin:0\">{{ S.title }}<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-size:14.5px;color:#5B7A8C;margin:0 0 16px;padding-left:47px;line-height:1.5\">{{ S.note }}<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <sc-for list=\"{{ S.items }}\" as=\"q\" hint-placeholder-count=\"4\">\n            <div style=\"background:#fff;border:1.5px solid {{ q.border }};border-radius:18px;padding:20px 22px;transition:border-color .2s\">\n              <div style=\"display:flex;align-items:flex-start;gap:9px;margin-bottom:4px\">\n                <div style=\"font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;font-size:17.5px;line-height:1.3;flex:1\">{{ q.label }}<\u002Fdiv>\n                <sc-if value=\"{{ q.key0 }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"background:#FFF7E6;color:#B98600;font-weight:800;font-size:11px;padding:4px 9px;border-radius:999px;flex-shrink:0;white-space:nowrap\">★ clé<\u002Fspan>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ q.done }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"width:21px;height:21px;border-radius:50%;background:#2FBF7E;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0\">✓<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <p style=\"font-size:14px;color:#5B7A8C;margin:0 0 12px;line-height:1.5\">{{ q.hint }}<\u002Fp>\n              <textarea value=\"{{ q.value }}\" sc-camel-on-input=\"{{ q.onInput }}\" placeholder=\"{{ q.ph }}\" rows=\"{{ q.rows }}\" style=\"width:100%;border:1.5px solid #E5EFF5;background:#FBFDFE;border-radius:13px;padding:13px 15px;font-size:15.5px;font-weight:600;line-height:1.55;outline:none;resize:vertical;color:#0B2A3F\"><\u002Ftextarea>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <div style=\"background:#0B2A3F;border-radius:22px;padding:30px 32px;color:#fff;margin-top:8px\">\n      <div style=\"display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:20px\">\n        <img src=\"d6220c55-5cdc-40f5-bec4-0ee19e829525\" alt=\"\" style=\"width:78px;height:auto;aspect-ratio:574/678;flex-shrink:0\">\n        <div style=\"flex:1;min-width:230px\">\n          <div style=\"font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;font-size:24px;margin-bottom:5px\">{{ doneTitle }}<\u002Fdiv>\n          <div style=\"color:#B9CEDB;font-size:15.5px;line-height:1.5\">{{ doneNote }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n        <sc-if value=\"{{ canSend }}\" hint-placeholder-val=\"{{ false }}\">\n          <a sc-camel-on-click=\"{{ onSend }}\" style=\"text-decoration:none;color:{{ sendFg }};font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;font-size:17px;padding:14px 26px;border-radius:14px;background:{{ sendBg }};border-bottom:4px solid {{ sendEdge }};cursor:pointer;transition:transform .14s cubic-bezier(.34,1.4,.64,1),background .2s\" style-hover=\"transform:translateY(-2px)\" style-active=\"transform:translateY(2px);border-bottom-width:2px\">{{ sendLabel }}<\u002Fa>\n        <\u002Fsc-if>\n        <a sc-camel-on-click=\"{{ download }}\" style=\"text-decoration:none;color:{{ dlFg }};font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;font-size:17px;padding:{{ dlPad }};border-radius:14px;background:{{ dlBg }};border:{{ dlBorder }};border-bottom:{{ dlEdge }};cursor:pointer;transition:transform .14s cubic-bezier(.34,1.4,.64,1)\" style-hover=\"transform:translateY(-2px)\" style-active=\"transform:translateY(2px);border-bottom-width:2px\">Télécharger le fichier<\u002Fa>\n        <a sc-camel-on-click=\"{{ copy }}\" style=\"text-decoration:none;color:#fff;font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;font-size:17px;padding:12px 24px;border-radius:14px;background:transparent;border:2px solid #1C4A66;cursor:pointer\">{{ copyLabel }}<\u002Fa>\n        <a sc-camel-on-click=\"{{ reset }}\" style=\"text-decoration:none;margin-left:auto;color:#5E7E92;font-weight:800;font-size:14px;cursor:pointer;align-self:center\">Tout effacer<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n      <sc-if value=\"{{ isSent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#12405E;border:1px solid #2FBF7E;border-radius:14px;padding:15px 18px;margin-top:16px;color:#8FE0BC;font-weight:800;font-size:15px;animation:fp-rise .3s ease-out\">Merci — vos réponses nous sont parvenues. Nous revenons vers vous avec les premiers textes.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection><\u002Fdiv>\n\n    <sc-if value=\"{{ cannotSend }}\" hint-placeholder-val=\"{{ true }}\">\n      <p style=\"text-align:center;color:#5B7A8C;font-size:13px;font-weight:700;margin:22px 0 0\">Vos réponses restent sur votre appareil. Téléchargez le fichier et envoyez-le-nous par WhatsApp ou par e-mail.<\u002Fp>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ canSend }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"text-align:center;color:#5B7A8C;font-size:13px;font-weight:700;margin:22px 0 0\">Vos réponses sont enregistrées sur votre appareil jusqu'à l'envoi.<\u002Fp>\n    <\u002Fsc-if>\n    <div style=\"display:none\">\n  \n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:1000}}\">\nconst KEY = 'af_positionnement_v1';\n\n// ── Où arrivent les réponses ────────────────────────────────────────\n// Colle ici l'identifiant Formspree (formspree.io, compte gratuit) :\n// les réponses arriveront directement dans ta boîte mail.\n// Laisse vide pour désactiver l'envoi (le téléchargement reste possible).\nconst FORMSPREE_ID = 'mgawbdgj';\n// ────────────────────────────────────────────────────────────────────\n\nconst SECTIONS = [\n  { n:1, title:'À qui parlons-nous', color:'#00BCFB',\n    note:\"C'est le parent qui décide et qui paie. C'est donc à lui que le site s'adresse d'abord.\",\n    items:[\n      { id:'q1', label:\"Qui inscrit l'enfant ?\", hint:'Décrivez la personne type : âge, situation, pays de résidence, langue parlée à la maison.', ph:'ex. mères de 30-40 ans, nées en France, parlent français à la maison…', rows:3 },\n      { id:'q2', label:'Ces familles vivent où, principalement ?', hint:'France, Belgique, Canada, Maroc, ailleurs ? Y a-t-il un pays dominant ?', ph:'ex. 70% France, le reste Belgique et Canada', rows:2 },\n      { id:'q3', label:'Le parent parle-t-il arabe ?', hint:\"Couramment, un peu, pas du tout — cela change complètement le ton des explications.\", ph:'ex. comprend mais ne lit pas', rows:2 },\n      { id:'q4', label:\"Pourquoi veulent-ils que leur enfant apprenne l'arabe ?\", hint:'Transmission familiale, religion, retour au pays, école, ouverture culturelle ? Classez par importance.', ph:'ex. 1. transmission familiale  2. religion  3. voyages', rows:3, key:true },\n    ]},\n  { n:2, title:'Le problème réel', color:'#FF8A5B',\n    note:'Un bon texte nomme la difficulté avant de proposer la solution.',\n    items:[\n      { id:'q5', label:\"Qu'ont-ils déjà essayé avant ?\", hint:'École du quartier, cours en ligne, application, professeur privé, livres, rien ?', ph:'ex. école le samedi matin, une application, un cousin qui donnait des cours', rows:3 },\n      { id:'q6', label:\"Pourquoi cela n'a pas marché ?\", hint:\"Trop cher, trop scolaire, l'enfant s'ennuie, horaires impossibles, trop loin, abandon rapide ? C'est la réponse la plus utile du formulaire.\", ph:\"ex. l'enfant s'ennuyait, méthode trop scolaire, abandon après 2 mois\", rows:3, key:true },\n      { id:'q7', label:\"Qu'est-ce qui les inquiète le plus ?\", hint:\"Que l'enfant se décourage, perdre de l'argent, le temps d'écran, ne pas pouvoir aider soi-même ?\", ph:'ex. que ça devienne une corvée de plus', rows:2 },\n    ]},\n  { n:3, title:'Ce qui vous distingue', color:'#7C6BE8',\n    note:\"Sans réponse ici, le site ressemblera à tous les autres.\",\n    items:[\n      { id:'q8', label:'Quels sont vos concurrents directs ?', hint:\"Noms de sites, d'applications ou d'écoles que ces familles envisagent aussi.\", ph:'ex. Nom du site A, application B, école de quartier', rows:2 },\n      { id:'q9', label:\"Qu'avez-vous qu'ils n'ont pas ?\", hint:'Votre méthode, votre expérience, vos e-books, les lives, votre approche des tout-petits ?', ph:'ex. méthode par le jeu, e-books audio, lives où je réponds aux parents', rows:3, key:true },\n      { id:'q10', label:'Qui enseigne, et quelle est sa légitimité ?', hint:\"Formation, années d'expérience, nombre d'élèves accompagnés. Google et les parents accordent beaucoup de poids à ce point.\", ph:'ex. 8 ans d’enseignement, 400 élèves, diplôme en…', rows:3 },\n      { id:'q11', label:'Que disent vos élèves actuels de vous ?', hint:'Un ou deux témoignages réels, même bruts. Rien ne convainc mieux un parent qu’un autre parent.', ph:'ex. « Ma fille demande elle-même à faire sa leçon » — Samira, Lyon', rows:4 },\n    ]},\n  { n:4, title:'Le résultat promis', color:'#2FBF7E',\n    note:'Ce que le parent attend concrètement, et en combien de temps.',\n    items:[\n      { id:'q12', label:\"Après trois mois, l'enfant sait faire quoi ?\", hint:'Soyez concret : reconnaître les lettres, lire des mots simples, dire cinquante mots, écrire son prénom ?', ph:'ex. reconnaît les 28 lettres, lit des mots de 3 lettres, écrit son prénom', rows:3, key:true },\n      { id:'q13', label:\"Combien de temps par semaine attendez-vous de l'enfant ?\", hint:'Dix minutes par jour, deux séances de trente minutes ? Un rythme réaliste rassure.', ph:'ex. 15 minutes par jour, 5 jours sur 7', rows:2 },\n      { id:'q14', label:'Que ne promettez-vous pas ?', hint:\"Autant l'écrire clairement : pas de bilinguisme en trois mois, pas de remplacement d'un professeur ?\", ph:'ex. ce n’est pas un remplacement de l’école, pas de cours individuels', rows:2 },\n    ]},\n  { n:5, title:'Ton et vocabulaire', color:'#FFB800',\n    note:'Comment le site doit sonner, page après page.',\n    items:[\n      { id:'q15', label:'Comment voulez-vous que le site vous fasse sonner ?', hint:'Deux ou trois mots : chaleureux, sérieux, complice, professionnel, familial, moderne ?', ph:'ex. chaleureux, sérieux, jamais donneur de leçons', rows:2 },\n      { id:'q16', label:'Le site tutoie-t-il ou vouvoie-t-il ?', hint:\"Le prototype tutoie l'enfant. Faut-il vouvoyer le parent dans les pages qui lui sont destinées ?\", ph:'ex. tutoyer l’enfant, vouvoyer le parent', rows:2 },\n      { id:'q17', label:'Y a-t-il des mots à éviter ?', hint:'Certains termes religieux, scolaires ou commerciaux que vous ne voulez pas voir sur le site.', ph:'ex. éviter « élève », « devoirs », « promo »', rows:2 },\n      { id:'q18', label:'Comment Osaid, la mascotte, doit-il parler ?', hint:\"Comme un grand frère, un professeur, un copain de jeu ? Une phrase d'exemple suffit.\", ph:'ex. comme un grand frère : « Viens, on essaie ensemble ! »', rows:2 },\n    ]},\n  { n:6, title:'Recherche et visibilité', color:'#0398C9',\n    note:'Nécessaire pour que Google amène les bonnes familles sur le site.',\n    items:[\n      { id:'q19', label:'Que taperait un parent dans Google pour vous trouver ?', hint:'Écrivez les phrases telles quelles, même maladroites.', ph:\"ex. apprendre l'arabe à mon fils de 6 ans / cours arabe enfant en ligne gratuit\", rows:4, key:true },\n      { id:'q20', label:'Quelles questions vous pose-t-on tout le temps ?', hint:'Les vraies questions des parents, mot pour mot. Elles deviendront la FAQ et attireront du trafic.', ph:'ex. « à quel âge commencer ? », « est-ce que je dois être là avec lui ? »', rows:4 },\n      { id:'q21', label:'Où votre audience se trouve-t-elle déjà ?', hint:'TikTok, Instagram, groupes Facebook, WhatsApp, bouche-à-oreille ? Combien de personnes vous suivent ?', ph:'ex. 12 000 sur TikTok, 3 000 sur Instagram', rows:2 },\n    ]},\n  { n:7, title:'Prix et modèle', color:'#FF5A5F',\n    note:\"Les cours sont gratuits aujourd'hui. Il faut savoir où cela mène.\",\n    items:[\n      { id:'q22', label:'Les cours resteront-ils gratuits ?', hint:'Gratuits pour toujours, gratuits au lancement puis payants, une partie gratuite et le reste payant ?', ph:'ex. les 3 premiers cours gratuits, le reste payant plus tard', rows:2 },\n      { id:'q23', label:\"D'où viennent les revenus ?\", hint:'Uniquement les e-books, ou aussi des cours particuliers, un abonnement, des ateliers ?', ph:'ex. e-books aujourd’hui, abonnement envisagé', rows:2 },\n      { id:'q24', label:'Comment avez-vous fixé le prix des e-books ?', hint:'Comparaison avec la concurrence, coût de production, ressenti ? Y a-t-il une marge de manœuvre ?', ph:'ex. au ressenti, jamais testé plus haut', rows:2 },\n    ]},\n  { n:8, title:'Les anciens contacts', color:'#5B7A8C',\n    note:\"La réactivation des anciens élèves était l'un des objectifs du projet.\",\n    items:[\n      { id:'q25', label:'Combien de contacts avez-vous, et où sont-ils ?', hint:\"Liste d'e-mails, numéros WhatsApp, abonnés réseaux sociaux ? Combien environ ?\", ph:'ex. 600 e-mails, 200 numéros WhatsApp', rows:2 },\n      { id:'q26', label:\"Pourquoi ont-ils arrêté ?\", hint:'Fin de cycle, abandon, déménagement, prix ? Cela détermine ce qu’on leur écrira.', ph:'ex. la plupart ont fini le cycle, certains ont abandonné en route', rows:3 },\n      { id:'q27', label:'Quand leur avez-vous écrit pour la dernière fois ?', hint:'Une liste silencieuse depuis deux ans ne se réveille pas comme une liste active.', ph:'ex. il y a un an et demi', rows:2 },\n    ]},\n];\n\nconst ALL = SECTIONS.flatMap(s => s.items);\n\nclass Component extends DCLogic {\n  state = { a:{}, saved:false, copied:false, sendState:'idle' };\n\n  send = async () => {\n    if (!FORMSPREE_ID) return;\n    this.setState({ sendState:'sending' });\n    try {\n      const res = await fetch('https://formspree.io/f/' + FORMSPREE_ID, {\n        method:'POST',\n        headers:{ 'Content-Type':'application/json', 'Accept':'application/json' },\n        body: JSON.stringify({ sujet:'Positionnement Arab Facile', reponses:this.asText() }),\n      });\n      this.setState({ sendState: res.ok ? 'sent' : 'error' });\n    } catch (e) {\n      this.setState({ sendState:'error' });\n    }\n  };\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem(KEY);\n      if (raw) this.setState({ a: JSON.parse(raw) || {} });\n    } catch (e) {}\n  }\n\n  persist = (a) => { try { localStorage.setItem(KEY, JSON.stringify(a)); } catch (e) {} };\n\n  set = (id) => (e) => {\n    const v = e.target.value;\n    this.setState(s => {\n      const a = { ...s.a, [id]:v };\n      clearTimeout(this._t);\n      this._t = setTimeout(() => this.persist(a), 400);\n      return { a, saved:false };\n    });\n  };\n\n  asText = () => {\n    const a = this.state.a;\n    let out = 'ARAB FACILE — POSITIONNEMENT ET MESSAGE\\n';\n    out += 'Rempli le ' + new Date().toLocaleDateString('fr-FR') + '\\n';\n    for (const S of SECTIONS) {\n      out += '\\n\\n' + S.n + '. ' + S.title.toUpperCase() + '\\n' + '='.repeat(48) + '\\n';\n      for (const q of S.items) {\n        out += '\\n' + q.label + '\\n' + (a[q.id] && a[q.id].trim() ? a[q.id].trim() : '(sans réponse)') + '\\n';\n      }\n    }\n    return out;\n  };\n\n  renderVals() {\n    const a = this.state.a;\n    const filled = ALL.filter(q => (a[q.id] || '').trim().length > 2).length;\n    const keysDone = ALL.filter(q => q.key && (a[q.id] || '').trim().length > 2).length;\n    const pct = Math.round((filled / ALL.length) * 100);\n    return {\n      sections: SECTIONS.map(S => ({ ...S,\n        items: S.items.map(q => {\n          const done = (a[q.id] || '').trim().length > 2;\n          return { ...q, value:a[q.id] || '', onInput:this.set(q.id), done,\n            key0: !!q.key, border: done ? '#C6EFDD' : (q.key ? '#FCE8BA' : '#E5EFF5') };\n        }) })),\n      pct: pct + '%',\n      progressLabel: filled + ' / ' + ALL.length + ' questions · ' + keysDone + '/5 questions clés',\n      saveLabel: this.state.saved ? 'Enregistré ✓' : 'Enregistrer',\n      copyLabel: this.state.copied ? 'Copié ✓' : 'Copier le texte',\n      doneTitle: filled === 0 ? 'Prêt quand vous voulez'\n        : (keysDone >= 5 ? 'Les cinq questions clés sont remplies' : (filled < ALL.length ? 'Vous pouvez envoyer même incomplet' : 'Formulaire complet')),\n      doneNote: keysDone >= 5\n        ? 'Avec ces réponses, les textes du site peuvent être écrits. Téléchargez le fichier et envoyez-le-nous.'\n        : \"Les cinq questions marquées d'une étoile suffisent pour commencer à écrire. Le reste peut venir plus tard.\",\n      dlFg: FORMSPREE_ID ? '#fff' : '#0B2A3F',\n      dlBg: FORMSPREE_ID ? 'transparent' : '#FFB800',\n      dlBorder: FORMSPREE_ID ? '2px solid #1C4A66' : 'none',\n      dlEdge: FORMSPREE_ID ? '2px solid #1C4A66' : '4px solid #C98F00',\n      dlPad: FORMSPREE_ID ? '12px 24px' : '14px 26px',\n      canSend: !!FORMSPREE_ID,\n      cannotSend: !FORMSPREE_ID,\n      onSend: this.send,\n      sendLabel: { idle:'Envoyer mes réponses', sending:'Envoi en cours…', sent:'Envoyé ✓', error:'Échec — réessayer' }[this.state.sendState],\n      sendBg: { idle:'#FFB800', sending:'#E0A800', sent:'#2FBF7E', error:'#FF5A5F' }[this.state.sendState],\n      sendEdge: { idle:'#C98F00', sending:'#B08400', sent:'#21935F', error:'#D13B40' }[this.state.sendState],\n      sendFg: this.state.sendState === 'idle' || this.state.sendState === 'sending' ? '#0B2A3F' : '#fff',\n      isSent: this.state.sendState === 'sent',\n      save: () => { this.persist(a); this.setState({ saved:true }); setTimeout(() => this.setState({ saved:false }), 2200); },\n      download: () => {\n        const blob = new Blob([this.asText()], { type:'text/plain;charset=utf-8' });\n        const el = document.createElement('a');\n        el.href = URL.createObjectURL(blob);\n        el.download = 'arab-facile-positionnement.txt';\n        el.click();\n      },\n      copy: () => {\n        const t = this.asText();\n        if (navigator.clipboard) navigator.clipboard.writeText(t);\n        this.setState({ copied:true });\n        setTimeout(() => this.setState({ copied:false }), 2200);\n      },\n      reset: () => {\n        if (!window.confirm('Effacer toutes vos réponses ?')) return;\n        try { localStorage.removeItem(KEY); } catch (e) {}\n        this.setState({ a:{} });\n      },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
